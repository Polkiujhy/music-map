name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_ARCHIVE_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  HADOLINT_VERSION: 2.13.1
  HADOLINT_BINARY_SHA256: f8b05e4c724cdeb84c0dca07e40936c3d875c0af5d120a27c94026a0f370b2cf
  SYFT_VERSION: 1.40.0
  SYFT_ARCHIVE_SHA256: f551cd16da3a5456f5245bb8045b98594263a678a9d2a07b462a05be0357b795
  GRYPE_VERSION: 0.115.0
  GRYPE_ARCHIVE_SHA256: 3fad92940650e514c0aa2dad83526942a055e210cec09a8a59d9c024adc2b90e
  TRIVY_VERSION: 0.70.0
  TRIVY_ARCHIVE_SHA256: 8b4376d5d6befe5c24d503f10ff136d9e0c49f9127a4279fd110b727929a5aa9

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # 2.35.5
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --strict --no-interaction

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Audit PHP dependencies
        run: composer audit --locked --no-interaction

      - name: Prepare ephemeral test environment
        run: |
          cp .env.example .env
          php artisan key:generate --force --no-interaction

      - name: Verify complete source contract
        run: sh scripts/verify-source-contract --tracked

      - name: Check PHP formatting
        run: vendor/bin/pint --test

      - name: Run PHP tests
        run: php artisan test

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install Node.js dependencies from lockfile
        run: npm ci --ignore-scripts

      - name: Audit Node.js dependencies
        run: npm audit --audit-level=high

      - name: Build frontend assets
        run: npm run build

  postgres-smoke:
    needs: application
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_DB: music_map_ci
          POSTGRES_USER: music_map_ci
          POSTGRES_PASSWORD: music_map_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U music_map_ci -d music_map_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: music_map_ci
      DB_USERNAME: music_map_ci
      DB_PASSWORD: music_map_ci
      DB_SSLMODE: disable
      SESSION_DRIVER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up PHP with PostgreSQL support
        uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # 2.35.5
        with:
          php-version: '8.4'
          coverage: none
          extensions: pdo_pgsql
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prepare ephemeral test environment
        run: |
          cp .env.example .env
          php artisan key:generate --force --no-interaction

      - name: Rebuild schema on PostgreSQL
        run: php artisan migrate:fresh --force --no-interaction

      - name: Run critical authentication and identity tests
        run: >-
          php artisan test
          tests/Feature/Auth
          tests/Feature/BankAccessTest.php
          tests/Unit/Services/Auth/ResolveGoogleIdentityTest.php

  source-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out complete history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checked-out source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Install checksum-pinned security tools
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          temporary="$(mktemp -d)"
          trap 'rm -rf "${temporary}"' EXIT
          tools="${RUNNER_TEMP}/e11-tools"
          install -d -m 0700 "${tools}"

          install_tar_tool() {
            local name="$1"
            local version="$2"
            local expected_sha256="$3"
            local asset="$4"
            local archive="${temporary}/${asset}"
            local extracted="${temporary}/${name##*/}"
            install -d -m 0700 "${extracted}"
            curl --fail --location --proto '=https' --proto-redir '=https' --tlsv1.2 \
              --output "${archive}" \
              "https://github.com/${name}/releases/download/v${version}/${asset}"
            printf '%s  %s\n' "${expected_sha256}" "${archive}" \
              | sha256sum --check --strict
            tar -xzf "${archive}" -C "${extracted}" "${name##*/}"
            install -m 0555 "${extracted}/${name##*/}" "${tools}/${name##*/}"
          }

          install_tar_tool gitleaks/gitleaks "${GITLEAKS_VERSION}" \
            "${GITLEAKS_ARCHIVE_SHA256}" \
            "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          install_tar_tool anchore/syft "${SYFT_VERSION}" \
            "${SYFT_ARCHIVE_SHA256}" "syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          install_tar_tool anchore/grype "${GRYPE_VERSION}" \
            "${GRYPE_ARCHIVE_SHA256}" "grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          install_tar_tool aquasecurity/trivy "${TRIVY_VERSION}" \
            "${TRIVY_ARCHIVE_SHA256}" "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"

          hadolint="${temporary}/hadolint-linux-x86_64"
          curl --fail --location --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --output "${hadolint}" \
            "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-linux-x86_64"
          printf '%s  %s\n' "${HADOLINT_BINARY_SHA256}" "${hadolint}" \
            | sha256sum --check --strict
          install -m 0555 "${hadolint}" "${tools}/hadolint"

          test "$("${tools}/gitleaks" version)" = "${GITLEAKS_VERSION}"
          "${tools}/hadolint" --version | grep -F "${HADOLINT_VERSION}" >/dev/null
          test "$("${tools}/syft" version | awk '$1 == "Version:" { print $2 }')" = "${SYFT_VERSION}"
          test "$("${tools}/grype" version | awk '$1 == "Version:" { print $2 }')" = "${GRYPE_VERSION}"
          "${tools}/trivy" --version | grep -F "Version: ${TRIVY_VERSION}" >/dev/null
          printf '%s\n' "${tools}" >> "${GITHUB_PATH}"

      - name: Reject secrets in complete Git history
        run: gitleaks git --redact --no-banner --log-opts="--all" .

      - name: Lint the production Dockerfile
        run: hadolint Dockerfile

      - name: Reject critical filesystem vulnerabilities with Trivy
        env:
          TRIVY_CACHE_DIR: ${{ runner.temp }}/e11-trivy-cache
        run: >-
          trivy filesystem --scanners vuln --severity CRITICAL --exit-code 1
          --no-progress .

      - name: Generate source SBOM with Syft
        env:
          SBOM_PATH: ${{ runner.temp }}/music-map-source.spdx.json
          SYFT_CHECK_FOR_APP_UPDATE: "false"
        shell: bash
        run: |
          set -euo pipefail
          syft "dir:${GITHUB_WORKSPACE}" --output "spdx-json=${SBOM_PATH}"
          jq -e '(.spdxVersion | startswith("SPDX-")) and (.packages | type == "array") and (.packages | length > 0)' \
            "${SBOM_PATH}" >/dev/null
          sha256sum "${SBOM_PATH}"

      - name: Retain the exact source SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: music-map-source-sbom
          path: ${{ runner.temp }}/music-map-source.spdx.json
          if-no-files-found: error
          retention-days: 14
          overwrite: true

      - name: Reject critical SBOM vulnerabilities with Grype
        env:
          SBOM_PATH: ${{ runner.temp }}/music-map-source.spdx.json
          GRYPE_DB_CACHE_DIR: ${{ runner.temp }}/e11-grype-db
          GRYPE_CHECK_FOR_APP_UPDATE: "false"
        run: grype "sbom:${SBOM_PATH}" --fail-on critical --output table

  container-images:
    needs: [application, postgres-smoke, source-security]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Build container targets serially
        run: |
          docker build --pull --build-arg SOURCE_SHA="${GITHUB_SHA}" --target fpm --tag "music-map-fpm:${GITHUB_SHA}" .
          docker build --build-arg SOURCE_SHA="${GITHUB_SHA}" --target queue --tag "music-map-queue:${GITHUB_SHA}" .
          docker build --build-arg SOURCE_SHA="${GITHUB_SHA}" --target scheduler --tag "music-map-scheduler:${GITHUB_SHA}" .
          docker build --build-arg SOURCE_SHA="${GITHUB_SHA}" --target nginx --tag "music-map-nginx:${GITHUB_SHA}" .

      - name: Verify non-root users and health checks
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' "music-map-fpm:${GITHUB_SHA}")" = "82:82"
          test "$(docker image inspect --format '{{.Config.User}}' "music-map-queue:${GITHUB_SHA}")" = "82:82"
          test "$(docker image inspect --format '{{.Config.User}}' "music-map-scheduler:${GITHUB_SHA}")" = "82:82"
          test "$(docker image inspect --format '{{.Config.User}}' "music-map-nginx:${GITHUB_SHA}")" = "101:101"
          for image in "music-map-fpm:${GITHUB_SHA}" "music-map-queue:${GITHUB_SHA}" "music-map-scheduler:${GITHUB_SHA}" "music-map-nginx:${GITHUB_SHA}"; do
            test "$(docker image inspect --format '{{if .Config.Healthcheck}}present{{end}}' "$image")" = "present"
            test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")" = "${GITHUB_SHA}"
          done

      - name: Log in to GHCR for main releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish exact main images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          docker tag "music-map-fpm:${GITHUB_SHA}" "ghcr.io/polkiujhy/music-map-fpm:${GITHUB_SHA}"
          docker tag "music-map-nginx:${GITHUB_SHA}" "ghcr.io/polkiujhy/music-map-nginx:${GITHUB_SHA}"
          docker tag "music-map-queue:${GITHUB_SHA}" "ghcr.io/polkiujhy/music-map-queue:${GITHUB_SHA}"
          docker tag "music-map-scheduler:${GITHUB_SHA}" "ghcr.io/polkiujhy/music-map-scheduler:${GITHUB_SHA}"
          docker push "ghcr.io/polkiujhy/music-map-fpm:${GITHUB_SHA}"
          docker push "ghcr.io/polkiujhy/music-map-nginx:${GITHUB_SHA}"
          docker push "ghcr.io/polkiujhy/music-map-queue:${GITHUB_SHA}"
          docker push "ghcr.io/polkiujhy/music-map-scheduler:${GITHUB_SHA}"

      - name: Create strict release manifest from RepoDigests
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail

          repo_digest() {
            local tagged_image="$1"
            local repository="$2"
            local candidate=""
            local digest=""
            local suffix=""

            while IFS= read -r candidate; do
              case "${candidate}" in
                "${repository}"@sha256:*)
                  digest="${candidate}"
                  break
                  ;;
              esac
            done < <(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "${tagged_image}")

            suffix="${digest#"${repository}"@sha256:}"
            if [ "${digest}" = "${suffix}" ] || ! printf '%s\n' "${suffix}" | grep -Eq '^[0-9a-f]{64}$'; then
              echo "missing exact RepoDigest for ${repository}" >&2
              return 1
            fi

            printf '%s@sha256:%s\n' "${repository}" "${suffix}"
          }

          release_directory="${RUNNER_TEMP}/music-map-release"
          install -d -m 0700 "${release_directory}"
          fpm_image="$(repo_digest "ghcr.io/polkiujhy/music-map-fpm:${GITHUB_SHA}" "ghcr.io/polkiujhy/music-map-fpm")"
          nginx_image="$(repo_digest "ghcr.io/polkiujhy/music-map-nginx:${GITHUB_SHA}" "ghcr.io/polkiujhy/music-map-nginx")"
          queue_image="$(repo_digest "ghcr.io/polkiujhy/music-map-queue:${GITHUB_SHA}" "ghcr.io/polkiujhy/music-map-queue")"
          scheduler_image="$(repo_digest "ghcr.io/polkiujhy/music-map-scheduler:${GITHUB_SHA}" "ghcr.io/polkiujhy/music-map-scheduler")"
          release_id="mm-${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          jq -n \
            --arg release_id "${release_id}" \
            --arg source_sha "${GITHUB_SHA}" \
            --arg fpm "${fpm_image}" \
            --arg nginx "${nginx_image}" \
            --arg queue "${queue_image}" \
            --arg scheduler "${scheduler_image}" \
            '{
              schema_version: 1,
              release_id: $release_id,
              source_sha: $source_sha,
              images: {
                fpm: $fpm,
                nginx: $nginx,
                queue: $queue,
                scheduler: $scheduler
              }
            }' > "${release_directory}/release.json"

          sh scripts/validate-release-manifest "${release_directory}/release.json" "${GITHUB_SHA}"
          sha256sum "${release_directory}/release.json"

      - name: Retain the deployable release manifest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: music-map-release
          path: ${{ runner.temp }}/music-map-release/release.json
          if-no-files-found: error
          retention-days: 30
          overwrite: true
