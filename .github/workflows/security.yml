name: Security

on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: music-map-security-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_ARCHIVE_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  HADOLINT_VERSION: 2.13.1
  HADOLINT_BINARY_SHA256: f8b05e4c724cdeb84c0dca07e40936c3d875c0af5d120a27c94026a0f370b2cf
  SYFT_VERSION: 1.40.0
  SYFT_ARCHIVE_SHA256: f551cd16da3a5456f5245bb8045b98594263a678a9d2a07b462a05be0357b795
  GRYPE_VERSION: 0.115.0
  GRYPE_ARCHIVE_SHA256: 3fad92940650e514c0aa2dad83526942a055e210cec09a8a59d9c024adc2b90e
  TRIVY_VERSION: 0.70.0
  TRIVY_ARCHIVE_SHA256: 8b4376d5d6befe5c24d503f10ff136d9e0c49f9127a4279fd110b727929a5aa9

jobs:
  source-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out complete history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checked-out source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Install checksum-pinned security tools
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          temporary="$(mktemp -d)"
          trap 'rm -rf "${temporary}"' EXIT
          tools="${RUNNER_TEMP}/e11-tools"
          install -d -m 0700 "${tools}"

          install_tar_tool() {
            local name="$1"
            local version="$2"
            local expected_sha256="$3"
            local asset="$4"
            local archive="${temporary}/${asset}"
            local extracted="${temporary}/${name##*/}"
            install -d -m 0700 "${extracted}"
            curl --fail --location --proto '=https' --proto-redir '=https' --tlsv1.2 \
              --output "${archive}" \
              "https://github.com/${name}/releases/download/v${version}/${asset}"
            printf '%s  %s\n' "${expected_sha256}" "${archive}" \
              | sha256sum --check --strict
            tar -xzf "${archive}" -C "${extracted}" "${name##*/}"
            install -m 0555 "${extracted}/${name##*/}" "${tools}/${name##*/}"
          }

          install_tar_tool gitleaks/gitleaks "${GITLEAKS_VERSION}" \
            "${GITLEAKS_ARCHIVE_SHA256}" \
            "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          install_tar_tool anchore/syft "${SYFT_VERSION}" \
            "${SYFT_ARCHIVE_SHA256}" "syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          install_tar_tool anchore/grype "${GRYPE_VERSION}" \
            "${GRYPE_ARCHIVE_SHA256}" "grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          install_tar_tool aquasecurity/trivy "${TRIVY_VERSION}" \
            "${TRIVY_ARCHIVE_SHA256}" "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"

          hadolint="${temporary}/hadolint-linux-x86_64"
          curl --fail --location --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --output "${hadolint}" \
            "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-linux-x86_64"
          printf '%s  %s\n' "${HADOLINT_BINARY_SHA256}" "${hadolint}" \
            | sha256sum --check --strict
          install -m 0555 "${hadolint}" "${tools}/hadolint"

          test "$("${tools}/gitleaks" version)" = "${GITLEAKS_VERSION}"
          "${tools}/hadolint" --version | grep -F "${HADOLINT_VERSION}" >/dev/null
          "${tools}/syft" version | grep -F "Version: ${SYFT_VERSION}" >/dev/null
          "${tools}/grype" version | grep -F "Version: ${GRYPE_VERSION}" >/dev/null
          "${tools}/trivy" --version | grep -F "Version: ${TRIVY_VERSION}" >/dev/null
          printf '%s\n' "${tools}" >> "${GITHUB_PATH}"

      - name: Reject secrets in complete Git history
        run: gitleaks git --redact --no-banner --log-opts="--all" .

      - name: Lint the production Dockerfile
        run: hadolint Dockerfile

      - name: Reject critical filesystem vulnerabilities with Trivy
        env:
          TRIVY_CACHE_DIR: ${{ runner.temp }}/e11-trivy-cache
        run: >-
          trivy filesystem --scanners vuln --severity CRITICAL --exit-code 1
          --no-progress .

      - name: Generate source SBOM with Syft
        env:
          SBOM_PATH: ${{ runner.temp }}/music-map-source.spdx.json
          SYFT_CHECK_FOR_APP_UPDATE: "false"
        shell: bash
        run: |
          set -euo pipefail
          syft "dir:${GITHUB_WORKSPACE}" --output "spdx-json=${SBOM_PATH}"
          jq -e '(.spdxVersion | startswith("SPDX-")) and (.packages | type == "array") and (.packages | length > 0)' \
            "${SBOM_PATH}" >/dev/null
          sha256sum "${SBOM_PATH}"

      - name: Retain the exact source SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: music-map-source-sbom
          path: ${{ runner.temp }}/music-map-source.spdx.json
          if-no-files-found: error
          retention-days: 14

      - name: Reject critical SBOM vulnerabilities with Grype
        env:
          SBOM_PATH: ${{ runner.temp }}/music-map-source.spdx.json
          GRYPE_DB_CACHE_DIR: ${{ runner.temp }}/e11-grype-db
          GRYPE_CHECK_FOR_APP_UPDATE: "false"
        run: grype "sbom:${SBOM_PATH}" --fail-on critical --output table
